<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>MEDICTIME</title>
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
</head>
<body>
  <header>
    <h1>MEDICTIME</h1>
    <h2>Controle de Medicamentos</h2>
    <p>Ajuda na organização dos remédios diários</p>
    <div id="login-screen">
      <input type="text" placeholder="Usuário">
      <input type="password" placeholder="Senha">
      <button class="btn">Entrar</button>
    </div>
  </header>

  <main>
    <section class="form-section">
      <h2>Adicionar Medicamento</h2>
      <form>
        <input type="text" placeholder="Nome do medicamento" required>
        <input type="time" required>
        <input type="text" placeholder="Dosagem (ex: 1 comprimido)" required>
        <textarea placeholder="Observações"></textarea>
        <button type="submit" class="btn">Salvar</button>
      </form>
    </section>

    <section class="med-list">
      <h2>Medicamentos Cadastrados</h2>
      <ul>
        <li>
          <strong>Nome_Medicamento_1</strong> às 08:00 - 1 comprimido
          <p>Após o café da manhã</p>
          <button class="delete-btn btn">Excluir</button>
        </li>
        <li>
          <strong>Nome_Medicamento_2</strong> às 20:00 - 1 comprimido
          <p>Antes de dormir</p>
          <button class="delete-btn btn">Excluir</button>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
